[package]
name = "eagle-editor"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
description = "Native 3D world and asset editor for Multi Theft Auto: San Andreas"
license = "GPL-3.0-only"
repository = "https://github.com/BlueEagle12/MTA-Eagle-Editor"
readme = "README.md"
keywords = ["mta", "renderware", "editor", "gta-sa"]
categories = ["graphics", "game-development"]

[dependencies]
quick-xml = "0.39.4"
macroquad = "0.4.15"
image = { version = "0.25.8", default-features = false, features = ["png", "gif", "jpeg", "bmp", "tga"] }
regex = "1.12.2"
walkdir = "2.5.0"
fontdue = "0.9"
serde_json = "1.0"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
texpresso = "2.0.2"
meshopt = "0.6.2"

[target.'cfg(windows)'.dependencies]
rfd = "0.15.4"

[build-dependencies]
gl_generator = "0.14.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
# Miniquad 0.4.10 requests a forward-compatible core profile on Windows,
# which removes the fixed-function OpenGL API used by Eagle's 3D renderer.
miniquad = { path = "vendor/miniquad" }
